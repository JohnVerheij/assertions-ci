name: Script tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install coverage.py
        # The scripts use only the Python standard library; coverage.py measures the tests. A virtual
        # environment, because the runner's Python is externally managed; every file hash is pinned.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps -r scripts/requirements-ci.txt

      - name: Run unit tests with coverage
        # Fails below 90% line and branch coverage of the scripts (the tests are not measured).
        run: |
          PYTHON="$RUNNER_TEMP/venv/bin/python"
          "$PYTHON" -m coverage run --branch --source=scripts --omit='scripts/test_*.py' -m unittest discover -s scripts -v
          "$PYTHON" -m coverage report --show-missing --fail-under=90
