name: Package CI

# Reusable CI for one package repository of the family. Convention-driven: every repository has
#   src/<Package>/                      framework-agnostic core (absent when has-core is false)
#   src/<Package>.TUnit/                TUnit adapter
#   tests/<Package>.Tests/              core tests (absent when has-core is false)
#   tests/<Package>.TUnit.Tests/        adapter tests
#   tests/<Package>.TUnit.SnapshotTests public API snapshot tests
#   tests/<Package>.TUnit.SmokeTest/    external consumer of the packed adapter, assembly Smoke.Consumer
#   .config/codecoverage.settings.xml   coverage scope
# With release: true it is also the build stage of a release: the same gates run on the exact packages that
# ship. The build job never holds a credential; the Codecov upload runs in its own job.
# See README.md for the caller contract.

on:
  workflow_call:
    inputs:
      package:
        description: Package name without the .TUnit suffix, for example LogAssertions.
        required: true
        type: string
      has-core:
        description: Whether the repository ships the framework-agnostic core package and its test project.
        required: false
        type: boolean
        default: true
      line-threshold:
        description: Minimum merged line coverage, as a fraction.
        required: false
        type: string
        default: '0.90'
      branch-threshold:
        description: Minimum merged branch coverage, as a fraction.
        required: false
        type: string
        default: '0.90'
      expected-package-files:
        description: Newline-separated paths that must be present in the adapter .nupkg, for example build/SnapshotAssertions.TUnit.targets.
        required: false
        type: string
        default: ''
      license-allowlist:
        description: Newline-separated PackageId=license entries the license gate accepts besides MIT.
        required: false
        type: string
        default: ''
      readme-samples:
        description: What a C# sample in the READMEs that does not compile against the packed packages does. report (a warning) or enforce (fails the build). See the README for the sample conventions.
        required: false
        type: string
        default: report
      release:
        description: Release build. Adds the version gate, release notes, a CycloneDX SBOM and an OpenVEX document per package, and uploads them with the packages and a SHA256SUMS file as the release-packages artifact. Skips the Codecov upload.
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: The release version (release builds only).
        value: ${{ jobs.build.outputs.version }}
      checksum:
        description: SHA-256 of the SHA256SUMS file in the release-packages artifact (release builds only).
        value: ${{ jobs.build.outputs.checksum }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test & pack
    runs-on: ubuntu-latest
    timeout-minutes: 30   # every suite, the smoke test and the Native AOT gate run once per target framework
    permissions:
      contents: read   # checkout only: build and test code never runs next to a credential
    outputs:
      version: ${{ steps.version.outputs.version }}
      checksum: ${{ steps.release.outputs.checksum }}
    env:
      PACKAGE: ${{ inputs.package }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Validate inputs
        env:
          README_SAMPLES: ${{ inputs.readme-samples }}
        run: |
          if [[ ! "$PACKAGE" =~ ^[A-Z][A-Za-z0-9]*Assertions$ ]]; then
            echo "::error::Input 'package' must be a package name such as LogAssertions, got '$PACKAGE'"
            exit 1
          fi
          if [[ "$README_SAMPLES" != report && "$README_SAMPLES" != enforce ]]; then
            echo "::error::Input 'readme-samples' must be report or enforce, got '$README_SAMPLES'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared scripts
        # job.workflow_sha is the commit of this reusable workflow, so the scripts always match the
        # workflow version the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JohnVerheij/assertions-ci
          ref: ${{ job.workflow_sha }}
          path: .assertions-ci
          sparse-checkout: scripts
          persist-credentials: false

      - name: Release version gate
        # Core and adapter ship in lockstep. On a tag, both csproj files must declare the tag's version; on a
        # branch (a dry-run), they must agree with each other.
        if: inputs.release
        id: version
        env:
          HAS_CORE: ${{ inputs.has-core }}
          DRY_RUN: ${{ github.ref_type != 'tag' }}
        run: python3 .assertions-ci/scripts/release_version.py

      - name: Release notes
        # From the CHANGELOG section of the version; a missing or empty section fails the release.
        if: inputs.release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          python3 .assertions-ci/scripts/release_notes.py "$VERSION" CHANGELOG.md "$RUNNER_TEMP/release/RELEASE_NOTES.md"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Target frameworks
        # Each suite runs once per target framework of its project, read from the project itself, so a repository
        # that adds a framework needs no workflow change. The global.json SDK brings only its own runtime; the
        # others are installed in the next step. A single-framework repository runs as before.
        id: frameworks
        env:
          HAS_CORE: ${{ inputs.has-core }}
        run: |
          frameworks() {
            local VALUE
            if ! VALUE=$(dotnet msbuild "$1" -getProperty:TargetFrameworks); then
              echo "::error::Could not read the target frameworks of $1: $VALUE" >&2
              return 1
            fi
            if [ -z "$VALUE" ] && ! VALUE=$(dotnet msbuild "$1" -getProperty:TargetFramework); then
              echo "::error::Could not read the target framework of $1: $VALUE" >&2
              return 1
            fi
            VALUE=$(tr ';' ' ' <<< "$VALUE" | xargs)
            if [ -z "$VALUE" ]; then
              echo "::error::$1 declares no target framework" >&2
              return 1
            fi
            echo "$VALUE"
          }
          CORE=""
          if [ "$HAS_CORE" = true ]; then
            CORE=$(frameworks "tests/${PACKAGE}.Tests/${PACKAGE}.Tests.csproj")
          fi
          ADAPTER=$(frameworks "tests/${PACKAGE}.TUnit.Tests/${PACKAGE}.TUnit.Tests.csproj")
          SNAPSHOT=$(frameworks "tests/${PACKAGE}.TUnit.SnapshotTests/${PACKAGE}.TUnit.SnapshotTests.csproj")
          SMOKE=$(frameworks "tests/${PACKAGE}.TUnit.SmokeTest/${PACKAGE}.TUnit.SmokeTest.csproj")
          SDK_CHANNEL=$(dotnet --version | cut -d. -f1,2)
          CHANNELS=""
          for TFM in $CORE $ADAPTER $SNAPSHOT $SMOKE; do
            if [[ ! "$TFM" =~ ^net([0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Unsupported target framework '$TFM' in a test project"
              exit 1
            fi
            CHANNEL="${BASH_REMATCH[1]}"
            if [ "$CHANNEL" != "$SDK_CHANNEL" ] && [[ " $CHANNELS " != *" $CHANNEL "* ]]; then
              CHANNELS="$CHANNELS $CHANNEL"
            fi
          done
          CHANNELS=$(xargs <<< "$CHANNELS")
          {
            echo "core=$CORE"
            echo "adapter=$ADAPTER"
            echo "snapshot=$SNAPSHOT"
            echo "smoke=$SMOKE"
            echo "runtimes<<RUNTIMES"
            for CHANNEL in $CHANNELS; do echo "${CHANNEL}.x"; done
            echo "RUNTIMES"
          } >> "$GITHUB_OUTPUT"
          echo "SDK $(dotnet --version); core: ${CORE:-none}; adapter: $ADAPTER; snapshot: $SNAPSHOT; smoke: $SMOKE; other runtimes: ${CHANNELS:-none}"

      - name: Setup .NET for the other target frameworks
        # The SDK of each other channel, for its runtime; global.json keeps selecting the pinned SDK.
        if: steps.frameworks.outputs.runtimes != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.frameworks.outputs.runtimes }}

      - name: Restore
        # Locked mode: every package must match packages.lock.json. The repositories already set
        # RestoreLockedMode on GitHub Actions; the flag makes it explicit where it runs.
        run: |
          dotnet restore --locked-mode
          dotnet tool restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: License gate
        # Every package that ships to consumers (not PrivateAssets=all, plus the transitive closure) must
        # be MIT, or be listed in the license-allowlist input. Reads the restore output of src/*.
        env:
          LICENSE_ALLOWLIST: ${{ inputs.license-allowlist }}
        run: python3 .assertions-ci/scripts/license_gate.py

      - name: Test core suite (with coverage)
        # The core test project references only the core package, so a TUnit type leaking into the
        # core's public surface fails to compile here. The = form of --coverage-output-format avoids a
        # documented MTP space-form mis-parse. Each framework writes its report under its own output folder
        # (bin/Release/<tfm>/TestResults), and the merge step takes them all.
        if: inputs.has-core
        env:
          FRAMEWORKS: ${{ steps.frameworks.outputs.core }}
        run: |
          FAILED=""
          for TFM in $FRAMEWORKS; do
            echo "::group::Core suite on $TFM"
            dotnet run --project "tests/${PACKAGE}.Tests/${PACKAGE}.Tests.csproj" \
              --framework "$TFM" --configuration Release --no-build \
              -- \
              --coverage \
              --coverage-settings .config/codecoverage.settings.xml \
              --coverage-output coverage.cobertura.xml \
              --coverage-output-format=cobertura || FAILED="$FAILED $TFM"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Core suite failed on:$FAILED"
            exit 1
          fi

      - name: Test adapter suite (with coverage)
        env:
          FRAMEWORKS: ${{ steps.frameworks.outputs.adapter }}
        run: |
          FAILED=""
          for TFM in $FRAMEWORKS; do
            echo "::group::Adapter suite on $TFM"
            dotnet run --project "tests/${PACKAGE}.TUnit.Tests/${PACKAGE}.TUnit.Tests.csproj" \
              --framework "$TFM" --configuration Release --no-build \
              -- \
              --coverage \
              --coverage-settings .config/codecoverage.settings.xml \
              --coverage-output coverage.cobertura.xml \
              --coverage-output-format=cobertura || FAILED="$FAILED $TFM"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Adapter suite failed on:$FAILED"
            exit 1
          fi

      - name: Test snapshot suite (no coverage)
        # Pins the public API surface; it measures surface, not behavior, so it adds nothing to coverage.
        env:
          FRAMEWORKS: ${{ steps.frameworks.outputs.snapshot }}
        run: |
          FAILED=""
          for TFM in $FRAMEWORKS; do
            echo "::group::Snapshot suite on $TFM"
            dotnet run --project "tests/${PACKAGE}.TUnit.SnapshotTests/${PACKAGE}.TUnit.SnapshotTests.csproj" \
              --framework "$TFM" --configuration Release --no-build || FAILED="$FAILED $TFM"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Snapshot suite failed on:$FAILED"
            exit 1
          fi

      - name: Merge coverage reports
        id: coverage
        run: |
          mapfile -t REPORTS < <(find tests -name 'coverage.cobertura.xml' | sort)
          if [ "${#REPORTS[@]}" -eq 0 ]; then
            echo "::error::No cobertura coverage report found"
            exit 1
          fi
          # Each run's coverage per assembly, also in the job summary: a lower rate on one framework shows code
          # that only the other framework covers. Report only; the thresholds apply to the merged report.
          python3 .assertions-ci/scripts/coverage_table.py "${REPORTS[@]}"
          if [ "${#REPORTS[@]}" -eq 1 ]; then
            MERGED="${REPORTS[0]}"
          else
            JOINED=$(IFS=';'; echo "${REPORTS[*]}")
            dotnet reportgenerator "-reports:$JOINED" "-targetdir:$RUNNER_TEMP/coverage-merged" "-reporttypes:Cobertura"
            MERGED="$RUNNER_TEMP/coverage-merged/Cobertura.xml"
          fi
          if [ ! -f "$MERGED" ]; then
            echo "::error::Merged coverage report $MERGED was not produced"
            exit 1
          fi
          REPORT="$RUNNER_TEMP/coverage/coverage.cobertura.xml"
          mkdir -p "$RUNNER_TEMP/coverage"
          cp "$MERGED" "$REPORT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          echo "Coverage report: $MERGED (from ${#REPORTS[@]} source report(s))"

      # Before the threshold check, so the coverage job can show the trend in Codecov even when the gate fails.
      - name: Upload coverage report
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ${{ steps.coverage.outputs.report }}
          retention-days: 7
          if-no-files-found: error

      - name: Check coverage thresholds
        env:
          LINE_THRESHOLD: ${{ inputs.line-threshold }}
          BRANCH_THRESHOLD: ${{ inputs.branch-threshold }}
          REPORT: ${{ steps.coverage.outputs.report }}
        run: |
          LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' "$REPORT" | head -1)
          BRANCH_RATE=$(grep -oP 'branch-rate="\K[^"]+' "$REPORT" | head -1)
          if [ -z "$LINE_RATE" ] || [ -z "$BRANCH_RATE" ]; then
            echo "::error::Could not read line-rate or branch-rate from $REPORT"
            exit 1
          fi
          awk -v l="$LINE_RATE" -v b="$BRANCH_RATE" -v lt="$LINE_THRESHOLD" -v bt="$BRANCH_THRESHOLD" 'BEGIN {
            printf "Line coverage:   %.2f%% (threshold %.2f%%)\n", l * 100, lt * 100
            printf "Branch coverage: %.2f%% (threshold %.2f%%)\n", b * 100, bt * 100
            failed = 0
            if (l < lt) { printf "::error::Line coverage %.2f%% is below %.2f%%\n", l * 100, lt * 100; failed = 1 }
            if (b < bt) { printf "::error::Branch coverage %.2f%% is below %.2f%%\n", b * 100, bt * 100; failed = 1 }
            exit failed
          }'

      - name: Pack core
        if: inputs.has-core
        run: >-
          dotnet pack "src/${PACKAGE}/${PACKAGE}.csproj" --configuration Release --no-build --output ./artifacts
          -p:ApiCompatGenerateSuppressionFile=true

      - name: Pack adapter
        run: >-
          dotnet pack "src/${PACKAGE}.TUnit/${PACKAGE}.TUnit.csproj" --configuration Release --no-build --output ./artifacts
          -p:ApiCompatGenerateSuppressionFile=true

      # Both packs pass ApiCompatGenerateSuppressionFile=true, so pack regenerates each CompatibilitySuppressions.xml
      # instead of failing, whatever the project sets. A changed or new file means the public API differs from the
      # baseline in a way the committed file does not record. Fail, so the regenerated file is committed and the API
      # change is reviewed in the pull request. A new file counts even where a .gitignore pattern would hide it. Line
      # endings are ignored: pack writes the platform's.
      - name: API compatibility suppressions unchanged
        run: |
          NEW_FILES=$(git ls-files --others -- '*CompatibilitySuppressions.xml')
          if git diff --quiet --ignore-cr-at-eol -- '*CompatibilitySuppressions.xml' && [ -z "$NEW_FILES" ]; then
            echo "The committed API compatibility suppressions match the packed packages."
            exit 0
          fi
          echo "::error::Pack changed the API compatibility suppressions: the public API differs from the ApiCompat baseline in a way the committed CompatibilitySuppressions.xml does not record. Run dotnet pack -p:ApiCompatGenerateSuppressionFile=true locally and commit the regenerated file."
          git --no-pager diff --ignore-cr-at-eol -- '*CompatibilitySuppressions.xml'
          if [ -n "$NEW_FILES" ]; then
            echo "New suppression files:"
            echo "$NEW_FILES"
          fi
          exit 1

      - name: Locate adapter package
        id: adapter
        run: |
          shopt -s nullglob
          NUPKGS=(./artifacts/"${PACKAGE}".TUnit.[0-9]*.nupkg)
          if [ "${#NUPKGS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ${PACKAGE}.TUnit .nupkg in ./artifacts, found ${#NUPKGS[@]}"
            ls -la ./artifacts
            exit 1
          fi
          FILE=$(basename "${NUPKGS[0]}")
          VERSION=${FILE#"${PACKAGE}.TUnit."}
          VERSION=${VERSION%.nupkg}
          echo "nupkg=${NUPKGS[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Adapter package: ${NUPKGS[0]} (version $VERSION)"

      - name: NuGet package validation
        # Meziantou's validation of every packed package: SourceLink and a deterministic build, symbols whose sources
        # resolve, XML documentation, readme, license, repository metadata, tags and optimized assemblies. An icon is
        # required from 1.0.0; the packages omit it before (their csproj files record that). The tool comes from
        # nuget.org at the version below, which Renovate updates in assertions-ci.
        env:
          # renovate: datasource=nuget depName=Meziantou.Framework.NuGetPackageValidation.Tool
          NUGET_VALIDATION_VERSION: 2.0.21
          VERSION: ${{ steps.adapter.outputs.version }}
        run: |
          dotnet tool install Meziantou.Framework.NuGetPackageValidation.Tool \
            --version "$NUGET_VALIDATION_VERSION" --tool-path "$RUNNER_TEMP/nuget-validation"
          EXCLUDED=()
          if [[ "$VERSION" == 0.* ]]; then
            EXCLUDED=(--excluded-rules IconMustBeSet)
          fi
          STATUS=0
          "$RUNNER_TEMP/nuget-validation/meziantou.validate-nuget-package" ./artifacts/*.nupkg "${EXCLUDED[@]}" \
            > "$RUNNER_TEMP/nuget-validation.json" || STATUS=$?
          python3 .assertions-ci/scripts/nuget_validation_report.py "$RUNNER_TEMP/nuget-validation.json"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::meziantou.validate-nuget-package exited with $STATUS"
            exit 1
          fi

      - name: XML documentation
        # What an IDE shows for the packed assemblies: no empty member, no generator placeholder summary, and every
        # <inheritdoc cref> leads to a summary (scripts/xmldoc_check.py).
        run: python3 .assertions-ci/scripts/xmldoc_check.py ./artifacts/*.nupkg

      - name: Verify package contents
        # Assets that unit tests cannot see (for example build/*.targets) but consumers depend on.
        if: inputs.expected-package-files != ''
        env:
          EXPECTED: ${{ inputs.expected-package-files }}
          NUPKG: ${{ steps.adapter.outputs.nupkg }}
        run: |
          CONTENTS=$(unzip -Z1 "$NUPKG")
          MISSING=0
          while IFS= read -r ENTRY; do
            ENTRY=$(echo "$ENTRY" | xargs)
            [ -z "$ENTRY" ] && continue
            if grep -qxF "$ENTRY" <<< "$CONTENTS"; then
              echo "OK: $ENTRY"
            else
              echo "::error::$ENTRY is missing from $NUPKG"
              MISSING=1
            fi
          done <<< "$EXPECTED"
          [ "$MISSING" -eq 0 ] || { echo "$CONTENTS"; exit 1; }

      - name: External-consumer smoke test
        # The smoke project consumes the adapter only through PackageReference, from the just-packed local
        # feed (its NuGet.config maps <Package>.* to ../../artifacts). SmokePackageVersion pins the exact
        # packed version; absolute --source paths avoid NuGet's fragile relative-path handling on Linux.
        # No locked mode here: the package was packed in this run, so its hash can't be in a lock file.
        env:
          SMOKE_VERSION: ${{ steps.adapter.outputs.version }}
          FRAMEWORKS: ${{ steps.frameworks.outputs.smoke }}
        run: |
          SMOKE="tests/${PACKAGE}.TUnit.SmokeTest/${PACKAGE}.TUnit.SmokeTest.csproj"
          dotnet restore "$SMOKE" \
            --force-evaluate \
            -p:SmokePackageVersion="$SMOKE_VERSION" \
            --source "$GITHUB_WORKSPACE/artifacts" \
            --source "https://api.nuget.org/v3/index.json"
          dotnet build "$SMOKE" --configuration Release --no-restore -p:SmokePackageVersion="$SMOKE_VERSION"
          FAILED=""
          for TFM in $FRAMEWORKS; do
            echo "::group::Smoke test on $TFM"
            dotnet run --project "$SMOKE" --framework "$TFM" --configuration Release --no-build \
              -p:SmokePackageVersion="$SMOKE_VERSION" || FAILED="$FAILED $TFM"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Smoke test failed on:$FAILED"
            exit 1
          fi

      - name: README code samples
        # Every C# sample in the READMEs compiles against the packed packages, the way a consumer would paste it:
        # scripts/readme_samples.py writes tests/.readme-samples/ from the smoke test project (its package
        # references, the packed version, implicit usings on) with #line directives back to each README line. With
        # readme-samples: enforce a failure fails the build. With report it is a warning: the first ten errors as
        # annotations on their README lines (GitHub's limit per step), all of them in the job summary.
        env:
          VERSION: ${{ steps.adapter.outputs.version }}
          FRAMEWORKS: ${{ steps.frameworks.outputs.smoke }}
          MODE: ${{ inputs.readme-samples }}
        run: |
          PROJECT=tests/.readme-samples/ReadmeSamples.csproj
          LOG="$RUNNER_TEMP/readme-samples.log"
          STATUS=0
          {
            python3 .assertions-ci/scripts/readme_samples.py "$PACKAGE" "$VERSION" "$FRAMEWORKS" &&
            dotnet restore "$PROJECT" --force-evaluate \
              --source "$GITHUB_WORKSPACE/artifacts" \
              --source "https://api.nuget.org/v3/index.json" &&
            dotnet build "$PROJECT" --configuration Release --no-restore
          } > "$LOG" 2>&1 || STATUS=$?
          head -1 "$LOG"
          if [ "$STATUS" -eq 0 ]; then
            echo "Every README sample compiles."
            exit 0
          fi
          if [ "$MODE" = enforce ]; then
            cat "$LOG"
            echo "::error::README samples do not compile against the packed packages (see the errors above)."
            exit 1
          fi
          ERRORS=$(grep -E ': error [A-Z]+[0-9]+:' "$LOG" | sed -E 's/ \[[^]]*\]$//' | sed -E "s#^$GITHUB_WORKSPACE/##" \
            | sort -u || true)
          if [ -z "$ERRORS" ]; then
            # No compiler error: the generation or the restore failed.
            cat "$LOG"
          else
            echo "$ERRORS" | sed -E 's#^(.+)\(([0-9]+),([0-9]+)\): error ([A-Z]+[0-9]+): #::warning file=\1,line=\2,col=\3::\4 #'
            {
              echo "### README samples that do not compile"
              echo
              echo '```text'
              echo "$ERRORS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::warning::README samples do not compile against the packed packages (readme-samples: report; enforce makes this fail the build)."

      - name: Native AOT gate
        # Publishes the smoke consumer with Native AOT and runs the native executable, which executes the
        # smoke tests compiled ahead of time. PublishAot is passed to the restore as well, so the ILCompiler
        # packages are in the restore graph; without that, publish silently produces a managed build. One native
        # executable per target framework; a failure on one framework does not stop the others.
        env:
          SMOKE_VERSION: ${{ steps.adapter.outputs.version }}
          FRAMEWORKS: ${{ steps.frameworks.outputs.smoke }}
        run: |
          SMOKE="tests/${PACKAGE}.TUnit.SmokeTest/${PACKAGE}.TUnit.SmokeTest.csproj"
          dotnet restore "$SMOKE" \
            --runtime linux-x64 \
            --force-evaluate \
            -p:PublishAot=true \
            -p:SmokePackageVersion="$SMOKE_VERSION" \
            --source "$GITHUB_WORKSPACE/artifacts" \
            --source "https://api.nuget.org/v3/index.json"
          # Publishes, checks and runs the native executable of one framework; returns 1 on the first failure.
          native_aot() {
            local TFM="$1"
            local OUT="$RUNNER_TEMP/aot/$TFM"
            local EXE="$OUT/Smoke.Consumer"
            if ! dotnet publish "$SMOKE" \
              --framework "$TFM" \
              --configuration Release \
              --runtime linux-x64 \
              --no-restore \
              -p:PublishAot=true \
              -p:SmokePackageVersion="$SMOKE_VERSION" \
              --output "$OUT"; then
              echo "::error::Native AOT publish failed on $TFM"
              return 1
            fi
            if [ ! -x "$EXE" ]; then
              echo "::error::Native executable $EXE was not produced"
              ls -la "$OUT"
              return 1
            fi
            if ! file "$EXE" | grep -q 'ELF 64-bit'; then
              echo "::error::$EXE is not a native ELF executable: $(file "$EXE")"
              return 1
            fi
            if [ -e "$OUT/Smoke.Consumer.dll" ]; then
              echo "::error::Smoke.Consumer.dll is present, so the $TFM publish was managed, not Native AOT"
              return 1
            fi
            echo "Native executable ($TFM): $(file "$EXE")"
            if ! "$EXE"; then
              echo "::error::The native smoke test failed on $TFM"
              return 1
            fi
          }
          FAILED=""
          for TFM in $FRAMEWORKS; do
            echo "::group::Native AOT on $TFM"
            native_aot "$TFM" || FAILED="$FAILED $TFM"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Native AOT gate failed on:$FAILED"
            exit 1
          fi

      - name: Release files
        # The exact packages that passed every gate above, with a CycloneDX 1.6 SBOM and an OpenVEX document per
        # package, and a SHA256SUMS file over all of them. The SBOM lists build-time packages with scope
        # "excluded"; its serial number stays in, because actions/attest uses it to recognize CycloneDX. The VEX
        # document starts with no statements and gains one when a dependency CVE is assessed. The hash of
        # SHA256SUMS reaches the publish job as a job output, a channel separate from the artifact store.
        if: inputs.release
        id: release
        env:
          HAS_CORE: ${{ inputs.has-core }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUT="$RUNNER_TEMP/release"
          IDS=("${PACKAGE}.TUnit")
          if [ "$HAS_CORE" = true ]; then IDS=("$PACKAGE" "${PACKAGE}.TUnit"); fi
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for ID in "${IDS[@]}"; do
            for EXT in nupkg snupkg; do
              FILE="artifacts/${ID}.${VERSION}.${EXT}"
              if [ ! -f "$FILE" ]; then
                echo "::error::$FILE was not produced"
                ls -la artifacts
                exit 1
              fi
              cp "$FILE" "$OUT/"
            done
            dotnet CycloneDX "src/${ID}/${ID}.csproj" -o "$OUT" -F Json -spv 1.6 \
              -fn "${ID}.${VERSION}.cdx.json" --exclude-test-projects
            cat > "$OUT/${ID}.${VERSION}.vex.json" <<EOF
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ID}.${VERSION}.vex.json",
            "author": "John Verheij",
            "timestamp": "${TIMESTAMP}",
            "version": 1,
            "tooling": "Generated at release time; statements are added as dependency CVEs are assessed",
            "statements": []
          }
          EOF
          done
          cd "$OUT"
          sha256sum -- *.nupkg *.snupkg *.cdx.json *.vex.json RELEASE_NOTES.md > SHA256SUMS
          cat SHA256SUMS
          echo "checksum=$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload package artifacts
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          retention-days: 7

      - name: Upload release artifact
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/release
          retention-days: 14
          if-no-files-found: error

  coverage:
    name: Upload coverage
    needs: build
    # Its own job, so the OIDC token never sits next to build and test code. It also runs when the build failed
    # its coverage threshold, so the trend stays visible in Codecov.
    if: ${{ !inputs.release && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout, so Codecov can map the report to the repository files
      id-token: write  # Codecov upload through OIDC, so no token secret is needed

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        id: download
        continue-on-error: true   # absent when the build failed before the tests ran
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage

      - name: Upload coverage to Codecov
        if: steps.download.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/coverage/coverage.cobertura.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: false
