name: Package zizmor

# Reusable security audit of a package repository's workflows. The caller keeps its triggers (with the paths filter on
# .github/workflows/**) and calls this workflow; the pinned action version pins the zizmor release it runs.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # checkout only
      actions: read    # zizmor reads workflow metadata of the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # Static analysis of every workflow under .github/. advanced-security: false makes zizmor exit non-zero on any
        # finding (template injection, dangerous trigger, unpinned action, credential persistence, ...), so this step
        # blocks the pull request on a new workflow-security regression; annotations: true shows each finding inline
        # on the diff. The SARIF/code-scanning mode is not used: it does not fail the job, and blocking is the goal.
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
